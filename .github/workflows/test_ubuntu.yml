name: Test Ubuntu Audit Script
on: [push, workflow_dispatch]
jobs:
  run-audit-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Unit Tests
        run: python3 -m unittest -v test_compliance_audit.py
      - name: Run Audit Script
        run: python3 Pattern_PC_Compliance_Audit.py
